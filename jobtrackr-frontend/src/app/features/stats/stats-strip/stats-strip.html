@let current = stats();
<div class="grid grid-cols-2 gap-3 md:grid-cols-4" role="group" aria-label="Application statistics">
  <div class="stat-card">
    <div class="stat-label">Total applied</div>
    <div class="stat-value text-accent" data-stat="total">{{ current.total }}</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Interviews</div>
    <div class="stat-value text-stat-interview" data-stat="interview">{{ current.interview }}</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Offers</div>
    <div class="stat-value text-stat-offer" data-stat="offer">{{ current.offer }}</div>
  </div>
  <div class="stat-card" title="Share of applications that got any answer: interview, offer or rejection">
    <div class="stat-label">Response rate</div>
    <div class="stat-value text-heading" data-stat="responseRate">{{ current.responseRate | percent: '1.0-0' }}</div>
    <!-- Decorative: the percentage above already says it -->
    <div class="mt-2 h-1.5 overflow-hidden rounded-pill bg-progress-track" aria-hidden="true">
      <div class="h-full rounded-pill bg-progress" [style.width.%]="current.responseRate * 100"></div>
    </div>
  </div>
</div>
