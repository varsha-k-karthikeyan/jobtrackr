# nginx for the JobTrackr frontend image: serves the built Angular app and forwards /api/ to the backend,
# so the browser talks to ONE origin (no CORS; the SameSite=Strict refresh cookie is first-party).
# Copied to /etc/nginx/templates/ in the image; the official image substitutes ${BACKEND_URL} at start-up.

server {
    listen 80;
    # IPv6 as well: inside the container "localhost" resolves to ::1 first (the HEALTHCHECK uses it), and the
    # image's automatic IPv6 listener only patches its stock config, which this template replaces
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    # Text compresses to roughly a quarter; images and fonts are already compressed
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # The API: same origin for the browser, the backend container (or URL) behind it
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Angular names every JS and CSS file after its content hash (outputHashing: all), so a changed file
    # always gets a new name: these can be cached for a year without ever serving stale code
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html is NOT hashed and points at the current bundles: the browser must revalidate it every time
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: /board, /list, /reset-password?token=... are client-side routes, not files
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
