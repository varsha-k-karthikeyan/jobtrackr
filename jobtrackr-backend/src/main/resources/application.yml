# Main configuration. Loaded for every run; src/test/resources/application-test.yml is layered on top in tests.
# The only value that must come from outside is JWT_SECRET (see the bottom of this file).
server:
  # Hosting platforms (and containers) commonly hand the port in through PORT; 8080 when it is absent
  port: ${PORT:8080}

# Actuator: only the health endpoint is exposed over HTTP, and only it is public (SecurityConfig).
management:
  endpoints:
    web:
      exposure:
        include: health          # explicit: nothing else (env, beans, metrics...) is reachable over HTTP
  endpoint:
    health:
      show-details: never        # just {"status":"UP"}: no versions, disk, or database details to an outsider
      probes:
        enabled: true            # /actuator/health/liveness and /readiness, outside Kubernetes too
  health:
    mail:
      # Without this, an unreachable SMTP server (no Mailpit, or no provider in production) would turn the
      # whole health DOWN and make container health checks restart a perfectly working app.
      # A failed reset email is already logged by PasswordResetEmailListener.
      enabled: false

spring:
  application:
    name: jobtrackr-backend

  # Local-only secrets (e.g. JWT_SECRET=...) from jobtrackr-backend/.env.properties, which git ignores.
  # "optional:" means a missing file is fine. A real environment variable of the same name still wins,
  # because OS environment variables rank above config files in Spring Boot's property order.
  config:
    import: optional:file:.env.properties

  # Must match the POSTGRES_* values and the port mapping in docker-compose.yml at the monorepo root.
  # These are local-development credentials; a deployed environment overrides them with
  # SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
  datasource:
    url: jdbc:postgresql://localhost:5432/jobtrackr
    username: jobtrackr
    password: jobtrackr

  jpa:
    hibernate:
      ddl-auto: validate   # Hibernate only checks entities against the schema; Flyway owns all DDL
    open-in-view: false    # no lazy loading during view rendering; fetch what you need inside the service

  flyway:
    enabled: true          # runs db/migration/V*.sql on startup, before Hibernate validates

  data:
    web:
      pageable:
        max-page-size: 100 # cap ?size= so a client cannot ask for the whole table in one page

  docker:
    compose:
      enabled: false       # Docker is started manually with `docker compose up -d` from the monorepo root

  # Outgoing mail (password-reset links). The defaults point at the local Mailpit container from
  # docker-compose.yml, which keeps every email in its web inbox (http://localhost:8025) and delivers nothing.
  # A real provider is configured purely through MAIL_* environment variables; credentials never go here.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      # Fail fast instead of tying up a thread if the mail server does not answer
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

# In-app follow-up notifications (notification/NotificationProperties.java), validated at startup
notifications:
  # "Today" for follow-up dates is decided in this zone, not in the JVM's UTC: a follow-up date is a
  # calendar date, and 01:00 in India is still yesterday in UTC.
  zone: ${NOTIFICATIONS_ZONE:Asia/Kolkata}
  # Follow-ups due within this many days after today are listed as "upcoming" (no badge count)
  upcoming-days: 7

# Application-specific settings, bound to auth/JwtProperties.java (validated at startup)
jobtrackr:
  jwt:
    # HS256 signing key from the environment (min 32 characters); never committed.
    # No default on purpose: the app refuses to start without it. Changing it invalidates every issued token.
    secret: ${JWT_SECRET}
    access-token-ttl: 15m  # short on purpose: the frontend renews it with the refresh token
    refresh-token-ttl: 14d # how long a session survives without any use; rotated on every refresh
    # The refresh cookie's Secure flag. Browsers only send Secure cookies over HTTPS, so it stays false
    # for http://localhost; set REFRESH_COOKIE_SECURE=true wherever the API runs on HTTPS.
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  cors:
    # Browser origins allowed to call the API, bound to common/config/CorsProperties.java.
    # Comma-separated; add the deployed frontend URL through the environment, e.g.
    # CORS_ALLOWED_ORIGINS=http://localhost:4200,https://jobtrackr.example.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # Background jobs (common/config/SchedulingConfig). Tests switch them off in application-test.yml.
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
  # Nightly delete of expired refresh-token and password-reset rows (auth/ExpiredTokenCleanupJob).
  # Spring cron: second minute hour day-of-month month day-of-week. Default: every day at 03:30, India time.
  token-cleanup:
    cron: ${TOKEN_CLEANUP_CRON:0 30 3 * * *}
    zone: Asia/Kolkata
  # "Forgot password" emails (auth/PasswordResetProperties.java), validated at startup
  password-reset:
    # Base URL of the frontend for the link in the email. Always from config, never from the request's
    # Host header: a forged Host would otherwise make a genuine email point at an attacker's site.
    app-url: ${APP_URL:http://localhost:4200}
    from: ${MAIL_FROM:JobTrackr <no-reply@jobtrackr.local>}
    # How long a reset link works. Short on purpose: the link is as good as the password until it is used.
    token-ttl: 30m
    # Minimum gap between two emails to the same account, so the endpoint cannot be used to flood an inbox
    resend-cooldown: 1m
