# Continuous integration: every push to main and every pull request into it must build and pass all tests.
# Nothing is deployed or pushed from here; the Docker job only proves both images still build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the jobs only read the code (artifact uploads need no extra permission)
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it supersedes
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The root package.json runs `husky` on install; CI needs no git hooks
  HUSKY: 0

jobs:
  backend:
    name: Backend (mvnw verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: jobtrackr-backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21 (Temurin) with the Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit and integration tests; Testcontainers starts PostgreSQL 16 in the runner's Docker.
      # The test profile carries its own dummy JWT secret, so no repository secret is needed.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload coverage report (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: jobtrackr-backend/target/site/jacoco/
          if-no-files-found: ignore

      - name: Upload test reports (surefire)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: jobtrackr-backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (tests and production build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jobtrackr-frontend
    steps:
      - uses: actions/checkout@v7

      # Angular 22 needs Node ^22.22.3, ^24.15.0 or >=26; 24 matches the Docker image and local development
      - name: Set up Node 24 with the npm cache
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: jobtrackr-frontend/package-lock.json

      # Only the frontend's own dependencies: the root package.json (commit tooling) is not needed here
      - run: npm ci --no-audit --no-fund
      - name: Unit tests (single run)
        run: npm run test:ci
      - name: Production build (fails above the 1 MB initial budget)
        run: npx ng build --configuration production

  docker:
    name: Docker images (build only, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build the backend image
        uses: docker/build-push-action@v7
        with:
          context: jobtrackr-backend
          push: false
          tags: jobtrackr-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build the frontend image
        uses: docker/build-push-action@v7
        with:
          context: jobtrackr-frontend
          push: false
          tags: jobtrackr-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  commitlint:
    name: Commit messages (pull requests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the whole history, so every commit of the PR can be read

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      # The repository's own commitlint and rules, the same ones the local husky hook runs
      - run: npm ci --no-audit --no-fund
      - name: Lint every commit in the pull request
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
